<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHEELZ ST. | Secure Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{--black:#000;--blue:#1f4fd8;--grey:#6b7280;}
body{margin:0;font-family:Segoe UI,Arial;background:#fff;color:#000}
.hidden{display:none}

/* LOGIN */
#login{
  height:100vh;display:flex;justify-content:center;align-items:center;
}
.login-box{
  width:360px;padding:30px;border:1px solid #e5e7eb;border-radius:14px;
}
input,select{
  width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ccc;
}
button{
  padding:10px 16px;border:none;border-radius:8px;
  background:#000;color:#fff;cursor:pointer;width:100%;
}

/* HEADER */
header{padding:22px 60px;border-bottom:1px solid #e5e7eb;font-weight:800;font-size:26px}
header span{color:#1f4fd8}

/* NAV */
nav{display:flex;gap:16px;padding:20px 60px}
nav button{width:auto}

/* SECTIONS */
section{width:92%;margin:30px auto}
table{width:100%;border-collapse:collapse;background:#f9fafb;border-radius:14px}
th,td{padding:12px;text-align:center;border-bottom:1px solid #e5e7eb}
th{background:#f1f5f9;color:#1f4fd8}
canvas{background:#f9fafb;border-radius:14px;padding:20px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>WHEELZ ST. Admin Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="err" style="color:red"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<header>WHEELZ<span>ST.</span> Dashboard</header>

<nav>
  <button onclick="showTab('finance')">Finance</button>
  <button onclick="showTab('add')">Add Data</button>
</nav>

<!-- FINANCE -->
<section id="finance">
<table id="financeTable">
<tr><th>Month</th><th>Cars Sold</th><th>Sales (AED)</th><th>Profit (AED)</th><th>Margin</th></tr>
<tr><td>November</td><td>17</td><td>390000</td><td>700000</td><td></td></tr>
<tr><td>December</td><td>24</td><td>8923000</td><td>1800000</td><td></td></tr>
<tr><td>January</td><td>11</td><td>1200000</td><td>2232000</td><td></td></tr>
<tr><th>Total</th><th></th><th></th><th></th><th></th></tr>
</table>
</section>

<section>
<canvas id="chart"></canvas>
</section>

<!-- ADD DATA -->
<section id="add" class="hidden">
<h2>Add Monthly Sales Data</h2>
<input id="m" placeholder="Month">
<input id="c" type="number" placeholder="Cars Sold">
<input id="s" type="number" placeholder="Sales AED">
<input id="p" type="number" placeholder="Profit AED">
<button onclick="addData()">Add Entry</button>
</section>

</div>

<script>
/* LOGIN */
function login(){
  if(user.value==="WheelzAdm1n@ff" && pass.value==="Adm1n4urqan90"){
    login.style.display="none";
    dashboard.classList.remove("hidden");
    recalc();
    buildChart();
  } else err.innerText="Invalid credentials";
}

/* NAV */
function showTab(id){
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

/* DATA */
function recalc(){
  const t=financeTable;
  let ts=0,tp=0;
  for(let i=1;i<t.rows.length-1;i++){
    let s=+t.rows[i].cells[2].innerText;
    let p=+t.rows[i].cells[3].innerText;
    t.rows[i].cells[4].innerText=((p/s)*100).toFixed(1)+"%";
    ts+=s; tp+=p;
  }
  t.rows[t.rows.length-1].cells[2].innerText="AED "+ts.toLocaleString();
  t.rows[t.rows.length-1].cells[3].innerText="AED "+tp.toLocaleString();
  t.rows[t.rows.length-1].cells[4].innerText=((tp/ts)*100).toFixed(1)+"%";
}

/* ADD ENTRY */
function addData(){
  const t=financeTable;
  const r=t.insertRow(t.rows.length-1);
  [m.value,c.value,s.value,p.value,""].forEach(v=>{
    const td=r.insertCell(); td.innerText=v;
  });
  recalc();
  buildChart();
  m.value=c.value=s.value=p.value="";
}

/* CHART */
let chart;
function buildChart(){
  const labels=[],sales=[],profits=[];
  for(let i=1;i<financeTable.rows.length-1;i++){
    labels.push(financeTable.rows[i].cells[0].innerText);
    sales.push(+financeTable.rows[i].cells[2].innerText);
    profits.push(+financeTable.rows[i].cells[3].innerText);
  }
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels,datasets:[
      {label:"Sales AED",data:sales},
      {label:"Profit AED",data:profits}
    ]}
  });
}
</script>

</body>
</html>
